services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kakebo
      POSTGRES_PASSWORD: local_change_me
      POSTGRES_DB: kakebo
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakebo"]
      interval: 5s
      retries: 10
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: kakebo
      MONGO_INITDB_ROOT_PASSWORD: local_change_me
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  postgres_data:
  mongo_data:
